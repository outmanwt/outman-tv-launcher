name: Android Debug Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 debug APK 并执行 Lint
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug

      - name: 运行纯 Kotlin 策略测试
        run: |
          python3 script/run_core_tests.py CoreTest
          python3 script/run_core_tests.py RouteTest

      - name: 上传 debug 测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: outman-tv-launcher-debug
          path: src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
